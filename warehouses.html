<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>روايات البناء — المخازن والمستودعات</title>
<link rel="icon" href="https://i.postimg.cc/sg88PV0h/5911057288288472436.jpg" type="image/jpeg">
<link rel="manifest" href="m-warehouses.webmanifest">
<meta name="theme-color" content="#8E2E3A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="المخازن">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body{font-family:'Tajawal',sans-serif;background:linear-gradient(135deg,#FDF8F3 0%,#f5e6d8 100%);min-height:100vh}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:#8E2E3A;border-radius:4px}
</style>
</head>
<body class="text-[#5a1c25]">
<div id="appRoot" class="p-4 md:p-6"></div>
<script src="seed-data.js"></script>
<script>
window.cfg = {
  key: "rb_warehouses", title: "المخازن والمستودعات", icon: "ph-warehouse", color: "maroon",
  subtitle: "إدارة المخزون والمستودعات والتوريدات والحركات",
  view: "table",
  columns: [
    { key: "sku", label: "الكود", type: "text" },
    { key: "item", label: "المادة", type: "text" },
    { key: "category", label: "التصنيف", type: "text" },
    { key: "qty", label: "الكمية", type: "number" },
    { key: "unit", label: "الوحدة", type: "text" },
    { key: "location", label: "المستودع", type: "text" },
    { key: "minStock", label: "الحد الأدنى", type: "number" },
    { key: "status", label: "الحالة", type: "badge", options: ["متوفر", "منخفض", "نفذ"],
      colors: { "متوفر": "green", "منخفض": "orange", "نفذ": "red" } }
  ],
  seed: RB_SEED.rb_warehouses,
  kpis: [
    { label: "أصناف المخزون", icon: "ph-warehouse", color: "maroon", calc: d => AC.count(d) },
    { label: "إجمالي الكميات", icon: "ph-stack", color: "orange", calc: d => AC.sum(d, "qty") },
    { label: "أصناف منخفضة", icon: "ph-warning", color: "red", calc: d => AC.count(d, x => x.status === "منخفض") },
    { label: "أصناف نفذت", icon: "ph-x-circle", color: "blue", calc: d => AC.count(d, x => x.status === "نفذ") }
  ],
  charts: [
    { title: "الكميات حسب التصنيف", type: "bar", icon: "ph-chart-bar", calc: d => AC.groupSum(d, "category", "qty") },
    { title: "عدد الأصناف حسب المستودع", type: "doughnut", icon: "ph-chart-pie-slice", calc: d => AC.groupCount(d, "location") }
  ]
};
</script>
<script src="admin-core.js"></script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(function(){})}</script>
</body>
</html>
