<title>روايات البناء — إعادة توجيه</title>
<style>
    body {
        margin: 0; padding: 0; height: 100vh;
        display: flex; justify-content: center; align-items: center;
        background: linear-gradient(135deg, #FDF8F3 0%, #f5e6d8 100%);
        font-family: 'Tajawal', sans-serif;
    }
    .card {
        text-align: center; padding: 40px 50px;
        background: white; border-radius: 20px;
        box-shadow: 0 20px 60px rgba(142,46,58,0.15);
        border-top: 5px solid #8E2E3A;
    }
    .logo {
        width: 80px; height: 80px; margin: 0 auto 20px;
        border-radius: 50%; overflow: hidden;
        border: 3px solid #EA7A2C;
        box-shadow: 0 4px 15px rgba(243,128,49,0.2);
    }
    .logo img { width: 100%; height: 100%; object-fit: cover; }
    h1 { color: #8E2E3A; margin: 0 0 8px; font-size: 1.5rem; }
    p { color: #8E2E3A; opacity: 0.7; margin: 0 0 20px; }
    .loader {
        width: 40px; height: 40px; margin: 0 auto;
        border: 4px solid #fce6e1;
        border-top-color: #EA7A2C;
        border-radius: 50%;
        animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    a { color: #EA7A2C; text-decoration: none; font-weight: bold; }
    a:hover { text-decoration: underline; }
</style>
</head>
<body>
    <div class="card">
        <div class="logo">
            <img src="https://i.postimg.cc/sg88PV0h/5911057288288472436.jpg" alt="روايات البناء">
        </div>
        <h1>روايات البناء</h1>
        <p>جاري التوجيه إلى نظام الإدارة الموحد...</p>
        <div class="loader"></div>

            إذا لم تنتقل تلقائياً، <a href="./%D8%B5%D9%81%D8%AD%D8%A7%D8%AA/%D8%A7%D9%84%D8%B5%D9%81%D8%AD%D8%A9%20%D8%A7%D9%84%D8%B9%D8%A7%D9%85%D8%A9/index.html">اضغط هنا</a>
        </p>
    </div>
</body>
