<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>روايات البناء — تقنية المعلومات</title>
<link rel="icon" href="https://i.postimg.cc/sg88PV0h/5911057288288472436.jpg" type="image/jpeg">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{font-family:'Tajawal',sans-serif;background:linear-gradient(135deg,#FDF8F3 0%,#f5e6d8 100%);min-height:100vh}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:#8E2E3A;border-radius:4px}
</style>
</head>
<body class="text-[#5a1c25]">
<div id="appRoot" class="p-4 md:p-6"></div>
<script src="seed-data.js"></script>
<script>
window.cfg = {
  key: "rb_it", title: "تقنية المعلومات", icon: "ph-desktop", color: "purple",
  subtitle: "تتبع الأجهزة والصيانة والبنية التحتية",
  view: "table",
  columns: [
    { key: "ticket", label: "رقم البلاغ", type: "text" },
    { key: "date", label: "التاريخ", type: "date" },
    { key: "asset", label: "الجهاز/الموقع", type: "text" },
    { key: "issue", label: "العطل/الطلب", type: "text" },
    { key: "status", label: "الحالة", type: "badge", options: ["مفتوح", "قيد العمل", "مغلق"],
      colors: { "مفتوح": "orange", "قيد العمل": "blue", "مغلق": "green" } },
    { key: "priority", label: "الأولوية", type: "badge", options: ["عالية", "متوسطة", "منخفضة"],
      colors: { "عالية": "red", "متوسطة": "orange", "منخفضة": "green" } },
    { key: "assigned", label: "المسؤول", type: "text" }
  ],
  seed: RB_SEED.rb_it,
  kpis: [
    { label: "بلاغات مفتوحة", icon: "ph-warning", color: "red", calc: d => AC.count(d, x => x.status === "مفتوح") },
    { label: "قيد العمل", icon: "ph-wrench", color: "blue", calc: d => AC.count(d, x => x.status === "قيد العمل") },
    { label: "بلاغات مغلقة", icon: "ph-check-circle", color: "green", calc: d => AC.count(d, x => x.status === "مغلق") },
    { label: "متوسط الوقت (يوم)", icon: "ph-clock", color: "purple", calc: d => AC.avg(d, "resolutionDays") + " يوم" }
  ]
};
</script>
<script src="admin-core.js"></script>
</body>
</html>
