<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>روايات البناء — المستندات والنماذج</title>
<link rel="icon" href="https://i.postimg.cc/sg88PV0h/5911057288288472436.jpg" type="image/jpeg">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{font-family:'Tajawal',sans-serif;background:linear-gradient(135deg,#FDF8F3 0%,#f5e6d8 100%);min-height:100vh}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:#8E2E3A;border-radius:4px}
</style>
</head>
<body class="text-[#5a1c25]">
<div id="appRoot" class="p-4 md:p-6"></div>
<script src="seed-data.js"></script>
<script>
window.cfg = {
  key: "rb_documents", title: "المستندات والنماذج", icon: "ph-files", color: "maroon",
  subtitle: "فهرسة وإدارة النماذج والمستندات والقوالب",
  view: "cards",
  columns: [
    { key: "code", label: "الكود", type: "text" },
    { key: "title", label: "الاسم", type: "text" },
    { key: "category", label: "التصنيف", type: "text" },
    { key: "type", label: "النوع", type: "badge", options: ["نموذج", "مستند", "تقرير", "مخطط"],
      colors: { "نموذج": "blue", "مستند": "green", "تقرير": "orange", "مخطط": "purple" } },
    { key: "version", label: "الإصدار", type: "text" },
    { key: "updated", label: "آخر تحديث", type: "date" }
  ],
  seed: RB_SEED.rb_documents,
  kpis: [
    { label: "إجمالي المستندات", icon: "ph-files", color: "maroon", calc: d => AC.count(d) },
    { label: "نماذج", icon: "ph-file-text", color: "blue", calc: d => AC.count(d, x => x.type === "نموذج") },
    { label: "تقارير", icon: "ph-chart-bar", color: "orange", calc: d => AC.count(d, x => x.type === "تقرير") },
    { label: "مخططات", icon: "ph-b Blueprint", color: "purple", calc: d => AC.count(d, x => x.type === "مخطط") }
  ]
};
</script>
<script src="admin-core.js"></script>
</body>
</html>
