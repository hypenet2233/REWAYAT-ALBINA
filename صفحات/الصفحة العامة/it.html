<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>روايات البناء — تقنية المعلومات</title>
<link rel="icon" href="https://i.postimg.cc/sg88PV0h/5911057288288472436.jpg" type="image/jpeg">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>body{font-family:'Tajawal',sans-serif;background:#f8fafc}::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:#8E2E3A;border-radius:4px}</style>
</head>
<body class="text-gray-800">
<div id="appRoot" class="p-4 md:p-6"></div>
<script src="seed-data.js"></script>
<script>
window.cfg = {
  key: "rb_it", title: "تقنية المعلومات", icon: "ph-desktop", color: "purple",
  subtitle: "إدارة تذاكر الدعم الفني والأصول التقنية",
  columns: [
    { key: "ticket", label: "رقم التذكرة", type: "text" },
    { key: "asset", label: "الأصل/الجهاز", type: "text" },
    { key: "user", label: "المستخدم/القسم", type: "text" },
    { key: "type", label: "النوع", type: "badge", options: ["صيانة", "تركيب", "شبكة", "برمجيات", "دعم"],
      colors: { "صيانة": "amber", "تركيب": "blue", "شبكة": "purple", "برمجيات": "maroon", "دعم": "green" } },
    { key: "priority", label: "الأولوية", type: "badge", options: ["عالية", "متوسطة", "منخفضة"],
      colors: { "عالية": "red", "متوسطة": "amber", "منخفضة": "green" } },
    { key: "status", label: "الحالة", type: "badge", options: ["مفتوحة", "قيد المعالجة", "مغلقة"],
      colors: { "مفتوحة": "blue", "قيد المعالجة": "orange", "مغلقة": "green" } },
    { key: "date", label: "التاريخ", type: "date" }
  ],
  seed: RB_SEED.rb_it,
  kpis: [
    { label: "تذاكر مفتوحة", icon: "ph-envelope-open", color: "blue", calc: d => AC.count(d, x => x.status === "مفتوحة") },
    { label: "قيد المعالجة", icon: "ph-spinner-gap", color: "orange", calc: d => AC.count(d, x => x.status === "قيد المعالجة") },
    { label: "أولوية عالية", icon: "ph-fire", color: "red", calc: d => AC.count(d, x => x.priority === "عالية" && x.status !== "مغلقة") },
    { label: "إجمالي التذاكر", icon: "ph-ticket", color: "purple", calc: d => d.length }
  ],
  charts: [
    { title: "التذاكر حسب الحالة", type: "doughnut", icon: "ph-chart-pie-slice", calc: d => AC.groupCount(d, "status") },
    { title: "التذاكر حسب النوع", type: "bar", icon: "ph-chart-bar", calc: d => AC.groupCount(d, "type") }
  ]
};
</script>
<script src="admin-core.js"></script>
</body>
</html>
