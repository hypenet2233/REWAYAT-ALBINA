<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>روايات البناء — شؤون العمال</title>
<link rel="icon" href="https://i.postimg.cc/sg88PV0h/5911057288288472436.jpg" type="image/jpeg">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>body{font-family:'Tajawal',sans-serif;background:#f8fafc}::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:#8E2E3A;border-radius:4px}</style>
</head>
<body class="text-gray-800">
<div id="appRoot" class="p-4 md:p-6"></div>
<script src="seed-data.js"></script>
<script>
window.cfg = {
  key: "rb_workers", title: "شؤون العمال", icon: "ph-hard-hat", color: "orange",
  subtitle: "إدارة العمالة في المواقع مع تنبيه ذكي لانتهاء الإقامات",
  columns: [
    { key: "id", label: "الرقم", type: "text" },
    { key: "name", label: "الاسم", type: "text" },
    { key: "nationality", label: "الجنسية", type: "text" },
    { key: "trade", label: "المهنة", type: "badge", options: ["لحام", "نجار", "كهربائي", "عامل", "سائق", "فني عزل"],
      colors: { "لحام": "red", "نجار": "amber", "كهربائي": "blue", "عامل": "gray", "سائق": "purple", "فني عزل": "green" } },
    { key: "project", label: "الموقع/المشروع", type: "text" },
    { key: "iqama", label: "انتهاء الإقامة", type: "date" },
    { key: "status", label: "الحالة", type: "badge", options: ["نشط", "إجازة", "منتهي"],
      colors: { "نشط": "green", "إجازة": "amber", "منتهي": "red" } }
  ],
  seed: RB_SEED.rb_workers,
  kpis: [
    { label: "إجمالي العمال", icon: "ph-hard-hat", color: "orange", calc: d => d.length },
    { label: "عمال نشطون", icon: "ph-user-check", color: "green", calc: d => AC.count(d, x => x.status === "نشط") },
    { label: "إقامات قرب الانتهاء (٦٠ يوم)", icon: "ph-warning-circle", color: "red", calc: d => AC.count(d, x => x.iqama && new Date(x.iqama).getTime() < Date.now() + 60 * 864e5) },
    { label: "الجنسيات", icon: "ph-globe", color: "blue", calc: d => new Set(d.map(x => x.nationality)).size }
  ],
  charts: [
    { title: "العمال حسب المهنة", type: "doughnut", icon: "ph-chart-pie-slice", calc: d => AC.groupCount(d, "trade") },
    { title: "توزيع العمال حسب المشروع", type: "bar", icon: "ph-chart-bar", calc: d => AC.groupCount(d, "project") }
  ]
};
</script>
<script src="admin-core.js"></script>
</body>
</html>
