<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>روايات البناء — مصنع البرتبلات</title>
<link rel="icon" href="https://i.postimg.cc/sg88PV0h/5911057288288472436.jpg" type="image/jpeg">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>body{font-family:'Tajawal',sans-serif;background:#f8fafc}::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:#8E2E3A;border-radius:4px}</style>
</head>
<body class="text-gray-800">
<div id="appRoot" class="p-4 md:p-6"></div>
<script src="seed-data.js"></script>
<script>
window.cfg = {
  key: "rb_portables", title: "مصنع البرتبلات", icon: "ph-house-line", color: "orange",
  subtitle: "تتبّع وحدات التصنيع من الهيكل حتى التسليم",
  view: "cards",
  columns: [
    { key: "code", label: "رقم الوحدة", type: "text" },
    { key: "type", label: "النوع", type: "badge", options: ["سكني", "مكتبي", "دورة مياه", "غرفة حارس", "استراحة"],
      colors: { "سكني": "maroon", "مكتبي": "blue", "دورة مياه": "purple", "غرفة حارس": "amber", "استراحة": "green" } },
    { key: "client", label: "العميل", type: "text" },
    { key: "size", label: "المقاس (م)", type: "text" },
    { key: "stage", label: "مرحلة التصنيع", type: "badge", options: ["هيكل", "تأسيس", "عزل وتكسية", "تشطيب", "جاهز"],
      colors: { "هيكل": "red", "تأسيس": "amber", "عزل وتكسية": "orange", "تشطيب": "blue", "جاهز": "green" } },
    { key: "progress", label: "نسبة الإنجاز", type: "progress" },
    { key: "due", label: "موعد التسليم", type: "date" }
  ],
  seed: RB_SEED.rb_portables,
  kpis: [
    { label: "إجمالي الوحدات", icon: "ph-stack", color: "orange", calc: d => d.length },
    { label: "قيد التصنيع", icon: "ph-gear", color: "maroon", calc: d => AC.count(d, x => x.stage !== "جاهز") },
    { label: "جاهزة للتسليم", icon: "ph-check-circle", color: "green", calc: d => AC.count(d, x => x.stage === "جاهز") },
    { label: "متوسط الإنجاز", icon: "ph-chart-line-up", color: "blue", calc: d => AC.avg(d, "progress") + "%" }
  ],
  charts: [
    { title: "الوحدات حسب مرحلة التصنيع", type: "doughnut", icon: "ph-chart-pie-slice", calc: d => AC.groupCount(d, "stage") },
    { title: "عدد الوحدات حسب النوع", type: "bar", icon: "ph-chart-bar", calc: d => AC.groupCount(d, "type") }
  ]
};
</script>
<script src="admin-core.js"></script>
</body>
</html>
