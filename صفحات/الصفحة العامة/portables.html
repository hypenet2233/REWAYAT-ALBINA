<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>روايات البناء — المصانع</title>
<link rel="icon" href="https://i.postimg.cc/sg88PV0h/5911057288288472436.jpg" type="image/jpeg">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body{font-family:'Tajawal',sans-serif;background:linear-gradient(135deg,#FDF8F3 0%,#f5e6d8 100%);min-height:100vh}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:#8E2E3A;border-radius:4px}
</style>
</head>
<body class="text-[#5a1c25]">
<div id="appRoot" class="p-4 md:p-6"></div>
<script src="seed-data.js"></script>
<script>
window.cfg = {
  key: "rb_portables", title: "المصانع", icon: "ph-house-line", color: "orange",
  subtitle: "تصنيع وبيع البرتبلات ومساكن العمال وكبائن الحراسة",
  view: "cards",
  columns: [
    { key: "code", label: "الكود", type: "text" },
    { key: "type", label: "النوع", type: "badge", options: ["برتبل", "مسكن عمال", "كبينة حراسة"],
      colors: { "برتبل": "orange", "مسكن عمال": "blue", "كبينة حراسة": "purple" } },
    { key: "size", label: "المقاس", type: "text" },
    { key: "qty", label: "الكمية", type: "number" },
    { key: "unitPrice", label: "السعر الوحدة", type: "money" },
    { key: "stage", label: "المرحلة", type: "badge", options: ["جديد", "قيد التصنيع", "جاهز", "تم البيع"],
      colors: { "جديد": "blue", "قيد التصنيع": "orange", "جاهز": "green", "تم البيع": "purple" } },
    { key: "due", label: "تاريخ التسليم", type: "date" }
  ],
  seed: RB_SEED.rb_portables,
  kpis: [
    { label: "قيد التصنيع", icon: "ph-wrench", color: "orange", calc: d => AC.count(d, x => x.stage === "قيد التصنيع") },
    { label: "إجمالي الطلبات", icon: "ph-stack", color: "maroon", calc: d => AC.count(d) },
    { label: "الإيرادات المتوقعة", icon: "ph-currency-circle-dollar", color: "green", calc: d => AC.money(AC.sum(d, "qty") * AC.sum(d, "unitPrice")) },
    { label: "جاهز للتسليم", icon: "ph-check-circle", color: "blue", calc: d => AC.count(d, x => x.stage === "جاهز") }
  ]
};
</script>
<script src="admin-core.js"></script>
</body>
</html>
