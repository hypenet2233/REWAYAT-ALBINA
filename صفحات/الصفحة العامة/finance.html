<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>روايات البناء — الشؤون المالية</title>
<link rel="icon" href="https://i.postimg.cc/sg88PV0h/5911057288288472436.jpg" type="image/jpeg">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>body{font-family:'Tajawal',sans-serif;background:#f8fafc}::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:#8E2E3A;border-radius:4px}</style>
</head>
<body class="text-gray-800">
<div id="appRoot" class="p-4 md:p-6"></div>
<script src="seed-data.js"></script>
<script>
const REV = d => AC.sum(d.filter(x => x.type === "إيراد"), "amount");
const EXP = d => AC.sum(d.filter(x => x.type === "مصروف"), "amount");
window.cfg = {
  key: "rb_finance", title: "الشؤون المالية", icon: "ph-money", color: "green",
  subtitle: "متابعة الإيرادات والمصروفات وصافي التدفق النقدي",
  columns: [
    { key: "ref", label: "المرجع", type: "text" },
    { key: "date", label: "التاريخ", type: "date" },
    { key: "type", label: "النوع", type: "badge", options: ["إيراد", "مصروف"],
      colors: { "إيراد": "green", "مصروف": "red" } },
    { key: "desc", label: "البيان", type: "text" },
    { key: "dept", label: "القسم", type: "badge", options: ["المقاولات", "البرتبلات", "المخازن", "الرواتب", "تشغيلي", "أخرى"],
      colors: { "المقاولات": "maroon", "البرتبلات": "orange", "المخازن": "amber", "الرواتب": "blue", "تشغيلي": "purple", "أخرى": "gray" } },
    { key: "amount", label: "المبلغ", type: "money" }
  ],
  seed: RB_SEED.rb_finance,
  kpis: [
    { label: "إجمالي الإيرادات", icon: "ph-trend-up", color: "green", calc: d => AC.money(REV(d)) },
    { label: "إجمالي المصروفات", icon: "ph-trend-down", color: "red", calc: d => AC.money(EXP(d)) },
    { label: "الصافي", icon: "ph-scales", color: "maroon", calc: d => AC.money(REV(d) - EXP(d)) },
    { label: "عدد الحركات", icon: "ph-receipt", color: "blue", calc: d => d.length }
  ],
  charts: [
    { title: "الإيرادات مقابل المصروفات (ر.س)", type: "bar", icon: "ph-chart-bar", calc: d => ({ labels: ["إيرادات", "مصروفات"], data: [REV(d), EXP(d)] }) },
    { title: "توزيع المصروفات حسب القسم", type: "doughnut", icon: "ph-chart-pie-slice", calc: d => AC.groupSum(d.filter(x => x.type === "مصروف"), "dept", "amount") }
  ]
};
</script>
<script src="admin-core.js"></script>
</body>
</html>
