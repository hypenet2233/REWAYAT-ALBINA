<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>روايات البناء — المقاولات العامة</title>
<link rel="icon" href="https://i.postimg.cc/sg88PV0h/5911057288288472436.jpg" type="image/jpeg">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#8E2E3A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="روايات البناء">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{font-family:'Tajawal',sans-serif;background:linear-gradient(135deg,#FDF8F3 0%,#f5e6d8 100%);min-height:100vh}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:#8E2E3A;border-radius:4px}
</style>
</head>
<body class="text-[#5a1c25]">
<div id="appRoot" class="p-4 md:p-6"></div>
<script src="seed-data.js"></script>
<script>
window.cfg = {
  key: "rb_contracting", title: "المقاولات العامة", icon: "ph-buildings", color: "maroon",
  subtitle: "إدارة المشاريع والعقود وتتبّع نسب الإنجاز والتسليم",
  view: "cards",
  columns: [
    { key: "ref", label: "المرجع", type: "text" },
    { key: "name", label: "اسم المشروع", type: "text" },
    { key: "client", label: "العميل/الجهة", type: "text" },
    { key: "location", label: "الموقع", type: "text" },
    { key: "value", label: "قيمة العقد", type: "money" },
    { key: "progress", label: "الإنجاز", type: "progress" },
    { key: "status", label: "الحالة", type: "badge", options: ["جديد", "قيد التنفيذ", "متوقف", "مكتمل"],
      colors: { "جديد": "blue", "قيد التنفيذ": "orange", "متوقف": "red", "مكتمل": "green" } },
    { key: "due", label: "تاريخ التسليم", type: "date" }
  ],
  seed: RB_SEED.rb_contracting,
  kpis: [
    { label: "مشاريع نشطة", icon: "ph-buildings", color: "maroon", calc: d => AC.count(d, x => x.status === "قيد التنفيذ") },
    { label: "إجمالي قيمة العقود", icon: "ph-currency-circle-dollar", color: "orange", calc: d => AC.money(AC.sum(d, "value")) },
    { label: "متوسط الإنجاز", icon: "ph-chart-line-up", color: "green", calc: d => AC.avg(d, "progress") + "%" },
    { label: "مشاريع مكتملة", icon: "ph-check-circle", color: "blue", calc: d => AC.count(d, x => x.status === "مكتمل") }
  ],
  charts: [
    { title: "توزيع المشاريع حسب الحالة", type: "doughnut", icon: "ph-chart-pie-slice", calc: d => AC.groupCount(d, "status") },
    { title: "قيمة العقود حسب العميل (ر.س)", type: "bar", icon: "ph-chart-bar", calc: d => AC.groupSum(d, "client", "value") }
  ]
};
</script>
<script src="admin-core.js"></script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(function(){})}</script>
</body>
</html>
