<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>روايات البناء — الشؤون المالية</title>
<link rel="icon" href="https://i.postimg.cc/sg88PV0h/5911057288288472436.jpg" type="image/jpeg">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body{font-family:'Tajawal',sans-serif;background:linear-gradient(135deg,#FDF8F3 0%,#f5e6d8 100%);min-height:100vh}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:#8E2E3A;border-radius:4px}
</style>
</head>
<body class="text-[#5a1c25]">
<div id="appRoot" class="p-4 md:p-6"></div>
<script src="seed-data.js"></script>
<script>
window.cfg = {
  key: "rb_finance", title: "الشؤون المالية", icon: "ph-money", color: "maroon",
  subtitle: "إدارة القيود والدفعات والإيرادات والمصروفات",
  view: "table",
  columns: [
    { key: "ref", label: "الرقم المرجعي", type: "text" },
    { key: "date", label: "التاريخ", type: "date" },
    { key: "desc", label: "البيان", type: "text" },
    { key: "type", label: "النوع", type: "badge", options: ["إيراد", "مصروف", "سحب"],
      colors: { "إيراد": "green", "مصروف": "red", "سحب": "blue" } },
    { key: "amount", label: "المبلغ (ر.س)", type: "money" },
    { key: "party", label: "الطرف/الجهة", type: "text" },
    { key: "attachment", label: "المرفق", type: "text" }
  ],
  seed: RB_SEED.rb_finance,
  kpis: [
    { label: "إجمالي الإيرادات", icon: "ph-trend-up", color: "green", calc: d => AC.money(AC.sum(d.filter(x => x.type === "إيراد"), "amount")) },
    { label: "إجمالي المصروفات", icon: "ph-trend-down", color: "red", calc: d => AC.money(AC.sum(d.filter(x => x.type === "مصروف"), "amount")) },
    { label: "الصافي", icon: "ph-scales", color: "maroon", calc: d => AC.money(AC.sum(d.filter(x => x.type === "إيراد"), "amount") - AC.sum(d.filter(x => x.type === "مصروف"), "amount")) },
    { label: "حركات مالية", icon: "ph-money", color: "orange", calc: d => d.length }
  ]
};
</script>
<script src="admin-core.js"></script>
</body>
</html>
